<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);font-family:Georgia,serif;color:#fff;text-align:center}
.box{padding:2rem;max-width:34rem}
h1{font-size:7rem;margin:0;letter-spacing:.5rem;animation:float 3s ease-in-out infinite}
p{font-size:1.4rem;margin:.5rem 0}
small{opacity:.7}
a{display:inline-block;margin-top:1.5rem;padding:.7rem 1.4rem;border-radius:2rem;background:#f9c74f;color:#1b1b1b;text-decoration:none;font-weight:bold}
@keyframes float{50%{transform:translateY(-12px)}}
</style>
</head>
<body>
<div class="box">
<h1>404</h1>
<p>Ceci n'est pas une page</p>
<small>This is not a page, just like the pipe is not a pipe.</small><br>
<a href="/">Take me home</a>
</div>
</body>
</html>
